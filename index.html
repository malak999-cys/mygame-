<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>لعبة سباق السرعة</title>
<style>
  /* ---------- Base layout ---------- */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0d0f14;
    font-family: Tahoma, Arial, "Segoe UI", sans-serif;
    color: #f2f2f2;
    overflow: hidden;
    touch-action: none; /* prevent page scroll/zoom gestures while playing */
  }
  #app {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #gameWrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute;
    top: 8px;
    left: 8px;
    right: 8px;
    display: flex;
    justify-content: space-between;
    gap: 6px;
    z-index: 5;
    pointer-events: none;
  }
  #hud .stat {
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 13px;
    white-space: nowrap;
  }
  #abilityBadges {
    position: absolute;
    top: 44px;
    left: 8px;
    right: 8px;
    display: flex;
    justify-content: center;
    gap: 8px;
    z-index: 5;
    pointer-events: none;
  }
  .badge {
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 12px;
  }
  .hidden { display: none !important; }
  #turnLabel {
    position: absolute;
    top: 44px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    border-radius: 20px;
    padding: 3px 12px;
    font-size: 12px;
    z-index: 5;
    pointer-events: none;
  }

  /* ---------- Canvas ---------- */
  #gameCanvas {
    display: block;
    background: #2f7a3d;
    border-radius: 10px;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.08);
    touch-action: none;
  }

  /* ---------- Mobile controls ---------- */
  #mobileControls {
    position: absolute;
    bottom: 18px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 5;
    pointer-events: none;
  }
  .ctrlBtn {
    pointer-events: auto;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.18);
    color: #fff;
    font-size: 26px;
    backdrop-filter: blur(2px);
    user-select: none;
  }
  .ctrlBtn:active { background: rgba(255,255,255,0.35); }

  /* ---------- Overlays ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(5,7,10,0.92);
    border-radius: 10px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    gap: 10px;
    overflow-y: auto;
  }
  .overlay h1 { margin: 0 0 6px 0; font-size: 26px; color: #ffd23f; }
  .overlay h2 { margin: 0 0 4px 0; font-size: 22px; color: #ffd23f; }
  .overlay p { margin: 2px 0; font-size: 14px; line-height: 1.6; color: #ddd; white-space: pre-line; }
  .overlay label {
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: center;
  }
  .overlay input[type="text"] {
    font-family: inherit;
    font-size: 14px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid #555;
    background: #1a1d24;
    color: #fff;
    width: 140px;
    text-align: center;
  }
  .mainBtn {
    margin-top: 8px;
    font-size: 17px;
    font-weight: bold;
    padding: 12px 34px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(180deg,#ffdc5c,#ffb703);
    color: #1a1a1a;
    cursor: pointer;
  }
  .mainBtn:active { transform: scale(0.97); }
  #leaderboardList {
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    min-width: 200px;
    max-height: 130px;
    overflow-y: auto;
  }
  #leaderboardList ol { margin: 4px 0; padding-inline-start: 20px; text-align: right; }
  #leaderboardList h3 { margin: 0 0 4px 0; font-size: 13px; color: #9fd6ff; }
</style>
</head>
<body>
<div id="app">
  <div id="gameWrap">

    <div id="hud">
      <div class="stat">المسافة: <span id="distanceVal">0</span> م</div>
      <div class="stat">السرعة: ×<span id="speedVal">1.0</span></div>
      <div class="stat">الأفضل: <span id="bestVal">0</span> م</div>
    </div>

    <div id="abilityBadges">
      <div id="shieldBadge" class="badge hidden">🛡 درع نشط</div>
      <div id="slowBadge" class="badge hidden">⏱ إبطاء <span id="slowTimeLeft"></span>ث</div>
    </div>

    <div id="turnLabel" class="hidden"></div>

    <canvas id="gameCanvas"></canvas>

    <div id="mobileControls">
      <button id="btnLeft" class="ctrlBtn" aria-label="تحريك يسار">◀</button>
      <button id="btnRight" class="ctrlBtn" aria-label="تحريك يمين">▶</button>
    </div>

    <!-- START LAYER -->
    <div id="startLayer" class="overlay">
      <h1>سباق السرعة 🏁</h1>
      <p>تجنّب السيارات القادمة، اجمع الدرع والإبطاء، واحصل على أعلى مسافة ممكنة.
التحكم: أسهم لوحة المفاتيح، أزرار الشاشة، أو السحب يمينًا/يسارًا.</p>
      <label>اسم اللاعب الأول:
        <input id="p1Name" type="text" maxlength="12" placeholder="اللاعب 1">
      </label>
      <label class="twoPlayerToggle">
        <input type="checkbox" id="twoPlayerCheck"> وضع لاعبين بالتناوب
      </label>
      <label id="p2NameWrap" class="hidden">اسم اللاعب الثاني:
        <input id="p2Name" type="text" maxlength="12" placeholder="اللاعب 2">
      </label>
      <div id="leaderboardList">
        <h3>أفضل النتائج</h3>
        <ol id="leaderboardOl"></ol>
      </div>
      <button id="startBtn" class="mainBtn">ابدأ اللعبة</button>
    </div>

    <!-- END / INTERIM LAYER (single button, content changes by phase) -->
    <div id="endLayer" class="overlay hidden">
      <h2 id="endTitle"></h2>
      <p id="endMessage"></p>
      <button id="endBtn" class="mainBtn"></button>
    </div>

  </div>
</div>

<script>
"use strict";

/* =========================================================================
   TUNING CONSTANTS — all gameplay knobs live here
   ========================================================================= */
const LOGICAL_W = 460;              // internal canvas width in logical px (wider road)
const LOGICAL_H = 700;              // internal canvas height in logical px
const LANES_COUNT = 3;              // number of lanes on the road
const ROAD_MARGIN = 18;             // shoulder width on each side (logical px)

const INITIAL_SPEED = 200;          // starting scroll speed, logical px/sec
const SPEED_INCREASE_PER_SEC = 2.5; // speed gained per second of play (gentler ramp)
const MAX_SPEED = 600;              // speed cap, logical px/sec

// Obstacle rows are paced by TIME, not by scrolled distance. This keeps the
// reaction-time gap between rows roughly stable even as speed climbs,
// instead of rows piling up automatically once the car goes faster.
const ROW_INTERVAL_START_MS = 1500; // time gap between rows at the start
const ROW_INTERVAL_MIN_MS = 800;    // smallest time gap allowed at max difficulty

const LANE_CHANGE_SPEED = 1300;     // px/sec the player car glides sideways (snappier dodging)
const HITBOX_MARGIN = 16;           // shrink collision rect on every side (forgiving near-misses)

const PLAYER_W = 46, PLAYER_H = 78;
const OBSTACLE_W = 46, OBSTACLE_H = 78;
const PLAYER_Y = LOGICAL_H - 130;   // fixed vertical position of player car

const MAX_DELTA_SEC = 0.1;          // hard cap on per-frame elapsed time (100ms)
const PIXELS_PER_METER = 12;        // used to convert scrolled px into "meters"

const POWERUP_MIN_GAP_MS = 6000;    // min time between power-up spawns
const POWERUP_MAX_GAP_MS = 11000;   // max time between power-up spawns
const POWERUP_SIZE = 38;
const SLOWDOWN_DURATION_MS = 3000;  // duration of the time-slow ability
const SLOWDOWN_FACTOR = 0.35;       // obstacle speed multiplier while slowed

const OBSTACLE_COLORS = ["#e74c3c", "#3498db", "#9b59b6", "#f39c12", "#1abc9c", "#e67e22"];
const LEADERBOARD_KEY = "racing_game_leaderboard_v1";
const LEADERBOARD_MAX_ENTRIES = 10;

/* =========================================================================
   DOM references
   ========================================================================= */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const distanceValEl = document.getElementById("distanceVal");
const speedValEl = document.getElementById("speedVal");
const bestValEl = document.getElementById("bestVal");
const shieldBadgeEl = document.getElementById("shieldBadge");
const slowBadgeEl = document.getElementById("slowBadge");
const slowTimeLeftEl = document.getElementById("slowTimeLeft");
const turnLabelEl = document.getElementById("turnLabel");

const startLayerEl = document.getElementById("startLayer");
const endLayerEl = document.getElementById("endLayer");
const endTitleEl = document.getElementById("endTitle");
const endMessageEl = document.getElementById("endMessage");
const endBtnEl = document.getElementById("endBtn");
const startBtnEl = document.getElementById("startBtn");

const p1NameInput = document.getElementById("p1Name");
const p2NameInput = document.getElementById("p2Name");
const p2NameWrap = document.getElementById("p2NameWrap");
const twoPlayerCheck = document.getElementById("twoPlayerCheck");
const leaderboardOl = document.getElementById("leaderboardOl");

const btnLeftEl = document.getElementById("btnLeft");
const btnRightEl = document.getElementById("btnRight");

/* =========================================================================
   Game state
   ========================================================================= */
// "start" | "playing" | "ended"
let state = "start";

// Match/session state (persists across the two rounds of two-player mode)
const match = {
  mode: "single",       // "single" | "two"
  turn: 1,               // 1 or 2, only relevant in two-player mode
  names: { 1: "اللاعب 1", 2: "اللاعب 2" },
  scores: { 1: null, 2: null }
};

// Per-round physics state. Everything here is reset by resetRoundState().
let speed, distancePx, player, obstacles, powerups;
let rowSpawnTimerMs, powerupTimerMs;
let shieldActive, slowRemainingMs;

let rafId = null;      // handle of the single active requestAnimationFrame call
let lastTimestamp = 0;
let dashOffset = 0;    // for animated moving lane dividers

let touchStartX = null;

/* =========================================================================
   Utility helpers
   ========================================================================= */
function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function lerp(a, b, t) {
  return a + (b - a) * clamp(t, 0, 1);
}

function laneCenterX(laneIndex) {
  const roadWidth = LOGICAL_W - ROAD_MARGIN * 2;
  const laneWidth = roadWidth / LANES_COUNT;
  return ROAD_MARGIN + laneWidth * laneIndex + laneWidth / 2;
}

function rectsOverlap(a, b, margin) {
  // Standard AABB overlap test, with both rects shrunk by `margin` on all sides.
  const ax1 = a.x + margin, ay1 = a.y + margin;
  const ax2 = a.x + a.w - margin, ay2 = a.y + a.h - margin;
  const bx1 = b.x + margin, by1 = b.y + margin;
  const bx2 = b.x + b.w - margin, by2 = b.y + b.h - margin;
  return ax1 < bx2 && ax2 > bx1 && ay1 < by2 && ay2 > by1;
}

function drawRoundedRect(context, x, y, w, h, r) {
  // Manual rounded-rect path (avoids relying on ctx.roundRect, which is not
  // available in every browser/version).
  context.beginPath();
  context.moveTo(x + r, y);
  context.arcTo(x + w, y, x + w, y + h, r);
  context.arcTo(x + w, y + h, x, y + h, r);
  context.arcTo(x, y + h, x, y, r);
  context.arcTo(x, y, x + w, y, r);
  context.closePath();
}

/* =========================================================================
   Sound (Web Audio API, no external files) — sfx + engine + background music
   ========================================================================= */
let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
  }
  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

function playTone(freq, duration, type, volume, delay) {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime + (delay || 0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || "sine";
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume || 0.2, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}

function sfxCollision() {
  playTone(140, 0.35, "sawtooth", 0.3, 0);
  playTone(80, 0.4, "square", 0.25, 0.05);
}
function sfxPickup() {
  playTone(880, 0.08, "sine", 0.2, 0);
  playTone(1300, 0.1, "sine", 0.2, 0.08);
}
function sfxGameOver() {
  playTone(420, 0.15, "triangle", 0.25, 0);
  playTone(320, 0.15, "triangle", 0.25, 0.15);
  playTone(220, 0.3, "triangle", 0.25, 0.3);
}
function sfxShieldBreak() {
  playTone(620, 0.2, "square", 0.25, 0);
}

// --- Continuous engine hum, pitch rises with speed ---
let engineOsc = null, engineGain = null;

function startEngineSound() {
  stopEngineSound(); // always clear any previous node before creating a new one
  if (!audioCtx) return;
  engineOsc = audioCtx.createOscillator();
  engineGain = audioCtx.createGain();
  engineOsc.type = "sawtooth";
  engineOsc.frequency.value = 55;
  engineGain.gain.value = 0.045;
  engineOsc.connect(engineGain).connect(audioCtx.destination);
  engineOsc.start();
}

function updateEngineSound() {
  if (!engineOsc || !audioCtx) return;
  const targetFreq = 55 + (speed / MAX_SPEED) * 150;
  engineOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.08);
}

function stopEngineSound() {
  if (engineOsc) {
    try { engineOsc.stop(); } catch (err) { /* already stopped, ignore */ }
    engineOsc.disconnect();
  }
  if (engineGain) engineGain.disconnect();
  engineOsc = null;
  engineGain = null;
}

// --- Energetic background racing beat, built from short scheduled tones ---
let musicTimeoutId = null;
const MUSIC_BASS_PATTERN = [110, 110, 165, 110, 130.8, 110, 165, 196];
const MUSIC_STEP_MS = 150;

function scheduleMusicStep(stepIndex) {
  if (state !== "playing") return; // auto-stop once the round is no longer active
  const freq = MUSIC_BASS_PATTERN[stepIndex % MUSIC_BASS_PATTERN.length];
  playTone(freq, 0.12, "square", 0.05, 0);
  if (stepIndex % 2 === 0) {
    playTone(1050, 0.03, "square", 0.025, 0.07); // short hi-hat-like tick for energy
  }
  musicTimeoutId = setTimeout(() => scheduleMusicStep(stepIndex + 1), MUSIC_STEP_MS);
}

function startMusic() {
  stopMusic(); // always clear any pending scheduled step before starting a new loop
  scheduleMusicStep(0);
}

function stopMusic() {
  if (musicTimeoutId !== null) {
    clearTimeout(musicTimeoutId);
    musicTimeoutId = null;
  }
}

/* =========================================================================
   Leaderboard (localStorage)
   ========================================================================= */
function loadLeaderboard() {
  try {
    const raw = localStorage.getItem(LEADERBOARD_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return [];
    return parsed;
  } catch (err) {
    return []; // storage disabled / corrupted data -> fail safe with empty list
  }
}

function saveScore(name, scoreMeters) {
  try {
    const list = loadLeaderboard();
    list.push({ name: name || "لاعب", score: scoreMeters });
    list.sort((a, b) => b.score - a.score);
    const trimmed = list.slice(0, LEADERBOARD_MAX_ENTRIES);
    localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(trimmed));
  } catch (err) {
    // localStorage may be unavailable (private mode / disabled storage) — ignore silently
  }
}

function getBestScore() {
  const list = loadLeaderboard();
  return list.length > 0 ? list[0].score : 0;
}

function renderLeaderboard() {
  const list = loadLeaderboard();
  leaderboardOl.innerHTML = "";
  if (list.length === 0) {
    leaderboardOl.innerHTML = "<li>لا توجد نتائج بعد</li>";
    return;
  }
  list.slice(0, 5).forEach(entry => {
    const li = document.createElement("li");
    li.textContent = entry.name + " — " + entry.score + " م";
    leaderboardOl.appendChild(li);
  });
}

/* =========================================================================
   Canvas sizing (responsive, DPR-aware, does not affect game logic units)
   ========================================================================= */
function resizeCanvas() {
  const maxCssWidth = Math.min(window.innerWidth * 0.95, 480);
  const maxCssHeight = window.innerHeight * 0.92;
  const scaleByWidth = maxCssWidth / LOGICAL_W;
  const scaleByHeight = maxCssHeight / LOGICAL_H;
  const scale = Math.min(scaleByWidth, scaleByHeight);

  const cssWidth = LOGICAL_W * scale;
  const cssHeight = LOGICAL_H * scale;

  canvas.style.width = cssWidth + "px";
  canvas.style.height = cssHeight + "px";

  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(LOGICAL_W * dpr);
  canvas.height = Math.round(LOGICAL_H * dpr);

  // All drawing code below always works in LOGICAL_W x LOGICAL_H units,
  // regardless of device pixel ratio. This keeps gameplay identical across
  // screens; only sharpness changes.
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", resizeCanvas);

/* =========================================================================
   Round reset — the ONE place that clears all per-round state
   ========================================================================= */
function resetRoundState() {
  speed = INITIAL_SPEED;
  distancePx = 0;

  const startLane = 1; // middle lane
  player = {
    lane: startLane,
    x: laneCenterX(startLane) - PLAYER_W / 2,
    targetX: laneCenterX(startLane) - PLAYER_W / 2,
    y: PLAYER_Y,
    w: PLAYER_W,
    h: PLAYER_H
  };

  obstacles = [];
  powerups = [];

  rowSpawnTimerMs = ROW_INTERVAL_START_MS;
  powerupTimerMs = randRange(POWERUP_MIN_GAP_MS, POWERUP_MAX_GAP_MS);

  shieldActive = false;
  slowRemainingMs = 0;

  dashOffset = 0;

  updateHudNumbers();
  updateAbilityBadges();
}

function randRange(min, max) {
  return min + Math.random() * (max - min);
}

/* =========================================================================
   Spawning
   ========================================================================= */
function spawnObstacleRow(speedRatio) {
  const maxBlocked = LANES_COUNT - 1; // always leave at least one lane free
  let blockedCount = 1;
  // Gradually allow more blocked lanes as speedRatio grows, instead of a
  // flat 50/50 chance from the very first row — this is what made the road
  // feel instantly crowded before.
  for (let extra = 1; extra < maxBlocked; extra++) {
    const chance = 0.08 + speedRatio * 0.45;
    if (Math.random() < chance) blockedCount++;
  }
  blockedCount = clamp(blockedCount, 1, maxBlocked);

  const laneIndices = [];
  for (let i = 0; i < LANES_COUNT; i++) laneIndices.push(i);
  shuffleArray(laneIndices);
  const blockedLanes = laneIndices.slice(0, blockedCount);
  const freeLanes = laneIndices.slice(blockedCount);

  blockedLanes.forEach(lane => {
    const color = OBSTACLE_COLORS[Math.floor(Math.random() * OBSTACLE_COLORS.length)];
    obstacles.push({
      lane: lane,
      x: laneCenterX(lane) - OBSTACLE_W / 2,
      y: -OBSTACLE_H,
      w: OBSTACLE_W,
      h: OBSTACLE_H,
      color: color
    });
  });

  // Small chance to also drop a power-up in one of the free lanes of this row.
  if (freeLanes.length > 0 && powerups.length === 0 && Math.random() < 0.35) {
    const lane = freeLanes[Math.floor(Math.random() * freeLanes.length)];
    const type = Math.random() < 0.5 ? "shield" : "slow";
    powerups.push({
      lane: lane,
      x: laneCenterX(lane) - POWERUP_SIZE / 2,
      y: -OBSTACLE_H - 40,
      w: POWERUP_SIZE,
      h: POWERUP_SIZE,
      type: type
    });
  }
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
}

/* =========================================================================
   Update (all motion is scaled by dt in seconds — frame-rate independent)
   ========================================================================= */
function update(dt) {
  // 1) increase difficulty over time, capped at MAX_SPEED
  speed = Math.min(MAX_SPEED, speed + SPEED_INCREASE_PER_SEC * dt);
  const speedRatio = (speed - INITIAL_SPEED) / (MAX_SPEED - INITIAL_SPEED);

  // 2) advance distance travelled (used for score)
  distancePx += speed * dt;

  // 3) smoothly glide the player toward its target lane (no sudden jump)
  if (player.x !== player.targetX) {
    const diff = player.targetX - player.x;
    const step = LANE_CHANGE_SPEED * dt;
    if (Math.abs(diff) <= step) {
      player.x = player.targetX;
    } else {
      player.x += Math.sign(diff) * step;
    }
  }

  // 4) countdown the slow-motion ability, if active
  if (slowRemainingMs > 0) {
    slowRemainingMs = Math.max(0, slowRemainingMs - dt * 1000);
  }
  const obstacleSpeed = slowRemainingMs > 0 ? speed * SLOWDOWN_FACTOR : speed;

  // 5) move obstacles down, remove ones that left the screen, check collisions
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.y += obstacleSpeed * dt;

    if (rectsOverlap(player, o, HITBOX_MARGIN)) {
      if (shieldActive) {
        // Shield absorbs exactly one collision.
        shieldActive = false;
        updateAbilityBadges();
        obstacles.splice(i, 1);
        sfxShieldBreak();
        continue;
      } else {
        endRound();
        return;
      }
    }

    if (o.y > LOGICAL_H + OBSTACLE_H) {
      obstacles.splice(i, 1);
    }
  }

  // 6) move power-ups down, check pickup, remove off-screen ones
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += obstacleSpeed * dt;

    if (rectsOverlap(player, p, 0)) {
      if (p.type === "shield") {
        shieldActive = true;
      } else if (p.type === "slow") {
        slowRemainingMs = SLOWDOWN_DURATION_MS;
      }
      updateAbilityBadges();
      sfxPickup();
      powerups.splice(i, 1);
      continue;
    }

    if (p.y > LOGICAL_H + POWERUP_SIZE) {
      powerups.splice(i, 1);
    }
  }

  // 7) spawn new obstacle rows on a TIME timer that tightens gradually
  //    (this is what keeps the road from feeling instantly crowded).
  rowSpawnTimerMs -= dt * 1000;
  while (rowSpawnTimerMs <= 0) {
    spawnObstacleRow(speedRatio);
    rowSpawnTimerMs += lerp(ROW_INTERVAL_START_MS, ROW_INTERVAL_MIN_MS, speedRatio);
  }

  // 8) power-up spawn timer (real time based, independent of obstacle rows)
  powerupTimerMs -= dt * 1000;
  if (powerupTimerMs <= 0) {
    powerupTimerMs = randRange(POWERUP_MIN_GAP_MS, POWERUP_MAX_GAP_MS);
  }

  // 9) animate lane divider dashes for a sense of speed
  dashOffset = (dashOffset + speed * dt) % 55;

  // 10) engine pitch follows current speed
  updateEngineSound();

  updateHudNumbers();
  if (slowRemainingMs > 0) {
    slowTimeLeftEl.textContent = Math.ceil(slowRemainingMs / 1000);
  }
}

/* =========================================================================
   Rendering
   ========================================================================= */
function drawCar(x, y, w, h, bodyColor, isPlayer) {
  drawRoundedRect(ctx, x, y, w, h, 10);
  ctx.fillStyle = bodyColor;
  ctx.fill();

  // windshield
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  drawRoundedRect(ctx, x + w * 0.15, y + h * 0.14, w * 0.7, h * 0.22, 4);
  ctx.fill();

  // rear window
  drawRoundedRect(ctx, x + w * 0.15, y + h * 0.64, w * 0.7, h * 0.18, 4);
  ctx.fill();

  // wheels
  ctx.fillStyle = "#111";
  const wheelW = w * 0.14, wheelH = h * 0.16;
  ctx.fillRect(x - wheelW * 0.3, y + h * 0.15, wheelW, wheelH);
  ctx.fillRect(x + w - wheelW * 0.7, y + h * 0.15, wheelW, wheelH);
  ctx.fillRect(x - wheelW * 0.3, y + h * 0.68, wheelW, wheelH);
  ctx.fillRect(x + w - wheelW * 0.7, y + h * 0.68, wheelW, wheelH);

  if (isPlayer && shieldActive) {
    ctx.save();
    ctx.strokeStyle = "rgba(80,180,255,0.9)";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + h / 2, w * 0.75, h * 0.62, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawPowerup(p) {
  const cx = p.x + p.w / 2, cy = p.y + p.h / 2, r = p.w / 2;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = p.type === "shield" ? "#3aa0ff" : "#b45cff";
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.8)";
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = "#fff";
  ctx.font = "bold 14px Tahoma";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(p.type === "shield" ? "درع" : "بطء", cx, cy + 1);
}

function render() {
  ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);

  const roadX = ROAD_MARGIN;
  const roadW = LOGICAL_W - ROAD_MARGIN * 2;

  // shoulders (grass)
  ctx.fillStyle = "#2f7a3d";
  ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

  // road surface
  ctx.fillStyle = "#3a3f47";
  ctx.fillRect(roadX, 0, roadW, LOGICAL_H);

  // road edge lines
  ctx.strokeStyle = "#f2f2f2";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(roadX, 0); ctx.lineTo(roadX, LOGICAL_H);
  ctx.moveTo(roadX + roadW, 0); ctx.lineTo(roadX + roadW, LOGICAL_H);
  ctx.stroke();

  // animated lane dividers
  ctx.strokeStyle = "rgba(255,255,255,0.85)";
  ctx.lineWidth = 3;
  ctx.setLineDash([26, 24]);
  ctx.lineDashOffset = -dashOffset;
  for (let i = 1; i < LANES_COUNT; i++) {
    const dividerX = roadX + (roadW / LANES_COUNT) * i;
    ctx.beginPath();
    ctx.moveTo(dividerX, 0);
    ctx.lineTo(dividerX, LOGICAL_H);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // obstacles
  obstacles.forEach(o => drawCar(o.x, o.y, o.w, o.h, o.color, false));

  // power-ups
  powerups.forEach(p => drawPowerup(p));

  // player
  drawCar(player.x, player.y, player.w, player.h, "#2ecc71", true);
}

/* =========================================================================
   Main loop — delta-time based, single active rAF handle
   ========================================================================= */
function loop(timestamp) {
  if (state !== "playing") {
    return; // safety: never keep animating once the round has ended
  }

  let dt = (timestamp - lastTimestamp) / 1000;
  lastTimestamp = timestamp;

  // Cap elapsed time so a tab coming back from background (or a long stall)
  // can never move objects far enough to skip through a hitbox in one frame.
  if (dt > MAX_DELTA_SEC) dt = MAX_DELTA_SEC;
  if (dt < 0) dt = 0; // guard against clock irregularities

  update(dt);
  if (state !== "playing") return; // update() may have ended the round

  render();

  rafId = requestAnimationFrame(loop);
}

function cancelLoop() {
  if (rafId !== null) {
    cancelAnimationFrame(rafId);
    rafId = null;
  }
}

function startLoop() {
  cancelLoop(); // always clear any pending frame before scheduling a new one
  lastTimestamp = performance.now();
  rafId = requestAnimationFrame(loop);
}

/* =========================================================================
   HUD helpers
   ========================================================================= */
function updateHudNumbers() {
  const meters = Math.floor(distancePx / PIXELS_PER_METER);
  distanceValEl.textContent = meters;
  speedValEl.textContent = (speed / INITIAL_SPEED).toFixed(1);
  bestValEl.textContent = getBestScore();
}

function updateAbilityBadges() {
  shieldBadgeEl.classList.toggle("hidden", !shieldActive);
  slowBadgeEl.classList.toggle("hidden", !(slowRemainingMs > 0));
}

function updateTurnLabel() {
  if (match.mode === "two") {
    turnLabelEl.textContent = "دور: " + match.names[match.turn];
    turnLabelEl.classList.remove("hidden");
  } else {
    turnLabelEl.classList.add("hidden");
  }
}

/* =========================================================================
   Player controls
   ========================================================================= */
function moveLane(direction) {
  if (state !== "playing") return;
  const newLane = clamp(player.lane + direction, 0, LANES_COUNT - 1);
  if (newLane !== player.lane) {
    player.lane = newLane;
    player.targetX = laneCenterX(newLane) - PLAYER_W / 2;
  }
}

document.addEventListener("keydown", e => {
  if (state !== "playing") return;
  if (e.key === "ArrowLeft") { moveLane(-1); e.preventDefault(); }
  else if (e.key === "ArrowRight") { moveLane(1); e.preventDefault(); }
});

btnLeftEl.addEventListener("click", () => moveLane(-1));
btnRightEl.addEventListener("click", () => moveLane(1));

canvas.addEventListener("touchstart", e => {
  touchStartX = e.changedTouches[0].clientX;
}, { passive: true });

canvas.addEventListener("touchmove", e => {
  e.preventDefault(); // stop the page from scrolling while swiping on canvas
}, { passive: false });

canvas.addEventListener("touchend", e => {
  if (state !== "playing" || touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const threshold = 30;
  if (dx > threshold) moveLane(1);
  else if (dx < -threshold) moveLane(-1);
  touchStartX = null;
}, { passive: true });

/* =========================================================================
   Round lifecycle
   ========================================================================= */
function beginRound() {
  resetRoundState();
  updateTurnLabel();
  startLayerEl.classList.add("hidden");
  endLayerEl.classList.add("hidden");
  state = "playing";
  startLoop();
  startEngineSound();
  startMusic();
}

function endRound() {
  cancelLoop();
  state = "ended";
  stopEngineSound();
  stopMusic();
  sfxCollision();
  sfxGameOver();

  const scoreMeters = Math.floor(distancePx / PIXELS_PER_METER);

  if (match.mode === "single") {
    saveScore(match.names[1], scoreMeters);
    showEndLayer(
      "انتهت الجولة!",
      "نتيجتك: " + scoreMeters + " م" + "\nأفضل نتيجة: " + getBestScore() + " م",
      "إعادة اللعب",
      () => { showStartLayer(); }
    );
  } else {
    match.scores[match.turn] = scoreMeters;

    if (match.turn === 1) {
      showEndLayer(
        "انتهى دور " + match.names[1],
        "نتيجة " + match.names[1] + ": " + scoreMeters + " م" + "\nحان دور " + match.names[2] + "!",
        "التالي: " + match.names[2],
        () => { match.turn = 2; beginRound(); }
      );
    } else {
      saveScore(match.names[1], match.scores[1]);
      saveScore(match.names[2], match.scores[2]);

      let resultText;
      if (match.scores[1] > match.scores[2]) {
        resultText = "الفائز: " + match.names[1] + " 🏆";
      } else if (match.scores[2] > match.scores[1]) {
        resultText = "الفائز: " + match.names[2] + " 🏆";
      } else {
        resultText = "تعادل!";
      }

      showEndLayer(
        "انتهت المباراة",
        match.names[1] + ": " + match.scores[1] + " م" + "\n" +
        match.names[2] + ": " + match.scores[2] + " م" + "\n" + resultText,
        "العب مرة أخرى",
        () => { showStartLayer(); }
      );
    }
  }
}

function showEndLayer(title, message, buttonText, onClick) {
  endTitleEl.textContent = title;
  endMessageEl.textContent = message;
  endBtnEl.textContent = buttonText;
  endBtnEl.onclick = onClick;
  endLayerEl.classList.remove("hidden");
}

function showStartLayer() {
  endLayerEl.classList.add("hidden");
  turnLabelEl.classList.add("hidden");
  renderLeaderboard();
  bestValEl.textContent = getBestScore();
  startLayerEl.classList.remove("hidden");
}

/* =========================================================================
   Start screen wiring
   ========================================================================= */
twoPlayerCheck.addEventListener("change", () => {
  p2NameWrap.classList.toggle("hidden", !twoPlayerCheck.checked);
});

startBtnEl.addEventListener("click", () => {
  ensureAudio(); // resume/create AudioContext inside a user gesture

  const name1 = p1NameInput.value.trim() || "اللاعب 1";
  const name2 = p2NameInput.value.trim() || "اللاعب 2";

  match.mode = twoPlayerCheck.checked ? "two" : "single";
  match.turn = 1;
  match.names = { 1: name1, 2: name2 };
  match.scores = { 1: null, 2: null };

  beginRound();
});

/* =========================================================================
   Boot
   ========================================================================= */
resizeCanvas();
renderLeaderboard();
bestValEl.textContent = getBestScore();
</script>
</body>
</html>
